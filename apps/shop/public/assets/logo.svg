<svg width="250" height="90" viewBox="0 0 250 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="text3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CBD5E1;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="electricGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FB82;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A352;stop-opacity:1" />
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" />
      <feOffset dx="1" dy="1.5" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <g fill="url(#text3D)" style="font-family: 'Inter', sans-serif; font-weight: 900;">
      <text x="10" y="45" font-size="34" letter-spacing="0">CH</text>
      <text x="90" y="45" font-size="34" letter-spacing="-0.5">LAK</text>
    </g>
    
    <path d="M67 46 L77 16 L87 46" stroke="#000000" stroke-width="6" fill="none" opacity="0.15" stroke-linejoin="round"/>
    <path d="M67 45 L77 15 L87 45" stroke="url(#text3D)" stroke-width="5" fill="none" stroke-linejoin="round"/>
    
    <path d="M77 11 L72 23 L82 23 L77 35" stroke="url(#electricGlow)" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#softShadow)"/>
  </g>

  <text x="12" y="68" fill="#00E676" style="font-family: 'Noto Sans Devanagari', sans-serif; font-size: 16px; letter-spacing: 1px; font-weight: 800; filter: drop-shadow(0px 2px 3px rgba(0,230,118,0.25));">
    मोबिलिटी
  </text>

  <rect x="10" y="76" width="130" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.1"/>
  <rect x="10" y="76" width="95" height="4" rx="2" fill="url(#electricGlow)"/>
  <circle cx="105" cy="78" r="5" fill="#00FB82" filter="url(#softShadow)"/>
</svg>