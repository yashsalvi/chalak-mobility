<header class="header">
  <div class="logo">
    <img src="assets/logo.svg" alt="Chalak Mobility" />
  </div>

  <nav>
    <a routerLink="/" routerLinkActive="active">  <lucide-icon name="house" size="18"></lucide-icon>
      {{ 'navigation.home' | translate }}</a>
    <a routerLink="/vehicles" routerLinkActive="active">   <lucide-icon name="car" size="18"></lucide-icon>{{ 'navigation.vehicles' | translate }}</a>
    <a routerLink="/plans" routerLinkActive="active"><lucide-icon name="layout-list" size="18"></lucide-icon>{{ 'navigation.plans' | translate }}</a>
    <a routerLink="/business" routerLinkActive="active"><lucide-icon name="briefcase" size="18"></lucide-icon>{{ 'navigation.business' | translate }}</a>
  </nav>

  <div class="header-actions">
    <app-vehicle-search></app-vehicle-search>
    <app-language-switcher></app-language-switcher>
    <div class="profile-dropdown" [class.active]="isProfileOpen">
      <button class="profile-btn" (click)="toggleProfile()" [class.active]="isProfileOpen">
        <lucide-icon name="user" size="20"></lucide-icon>
      </button>
      <div class="profile-menu" *ngIf="isProfileOpen">
        <div class="profile-menu-list">
          <button type="button" class="profile-menu-item" (click)="editProfile()">
            <div class="menu-item-content">
              <lucide-icon name="user" size="16"></lucide-icon>
              <span>{{ 'profile.edit' | translate }}</span>
            </div>
          </button>
          <button type="button" class="profile-menu-item" (click)="openSettings()">
            <div class="menu-item-content">
              <lucide-icon name="settings" size="16"></lucide-icon>
              <span>{{ 'profile.settings' | translate }}</span>
            </div>
          </button>
          <button type="button" class="profile-menu-item" (click)="openRecentBookingsPanel()">
            <div class="menu-item-content">
              <lucide-icon name="clock" size="16"></lucide-icon>
              <span>{{ 'profile.recentBookings' | translate }}</span>
            </div>
          </button>
        </div>

        <div class="recent-bookings-popup" *ngIf="showRecentBookingsPanel">
          <app-recent-bookings [compact]="true"></app-recent-bookings>
        </div>
      </div>
    </div>
    <button class="btn-primary" routerLink="/booking">{{ 'navigation.bookNow' | translate }}</button>
  </div>

  <div class="recent-bookings-panel" *ngIf="showRecentBookingsPanel">
    <div class="recent-bookings-panel-backdrop" (click)="closeRecentBookingsPanel()"></div>
    <div class="recent-bookings-panel-content">
      <button class="close-btn" (click)="closeRecentBookingsPanel()" aria-label="{{ 'common.closePanel' | translate }}">
        <lucide-icon name="x" size="20"></lucide-icon>
      </button>
      <app-recent-bookings></app-recent-bookings>
    </div>
  </div>
</header>
