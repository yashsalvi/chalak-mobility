<footer class="footer">
  <div class="container footer-grid">

    <div class="footer-brand">
      <h3>{{ 'brand.name' | translate }}</h3>
      <p>{{ 'footer.tagline' | translate }}</p>
    </div>

    <div class="links">
      <a href="#">{{ 'navigation.home' | translate }}</a>
      <a href="#">{{ 'navigation.vehicles' | translate }}</a>
      <a href="#">{{ 'navigation.plans' | translate }}</a>
      <a href="#">{{ 'navigation.business' | translate }}</a>
    </div>

    <div class="contact">
      <button class="btn-primary">{{ 'navigation.whatsapp' | translate }}</button>

      <div class="select-wrapper">
        <select aria-label="Language selection">
          <option>English</option>
          <option>हिंदी</option>
          <option>मराठी</option>
        </select>
        <lucide-icon name="chevron-down" size="16"></lucide-icon>
      </div>
    </div>

  </div>

  <p class="copyright">{{ 'footer.copyright' | translate }}</p>
</footer>
