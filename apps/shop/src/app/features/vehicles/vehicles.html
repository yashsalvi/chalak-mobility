<section class="vehicles">
  <div class="container">

    <div class="section-header">
      <h2>Our EV Fleet</h2>
      <p>Choose the right vehicle for your earning needs</p>
    </div>

    <div class="grid">

      <div class="card" *ngFor="let v of vehicles">

        <div class="badge">{{ v.tag }}</div>

        <div class="image">
          <img [src]="v.image" alt="{{v.name}}" />
        </div>

        <div class="content">
          <h3>{{ v.name }}</h3>

          <div class="price">
            ₹{{ v.price }}<span>/day</span>
          </div>

          <p class="save">Save ₹10 vs market</p>

          <button class="btn-primary">Book Now</button>
        </div>

      </div>

    </div>

  </div>
</section>
